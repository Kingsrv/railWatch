spring:
  application:
    name: railWatch

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/railwatch}
    username: ${DB_USERNAME:tiyashadatta}
    password: ${DB_PASSWORD:}

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

pnr:
  provider:
    base-url: https://api.railkit.in/api/v1
    api-key: ${RAILKIT_API_KEY}